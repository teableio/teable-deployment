# Private CA (PRIVATE_CA_FILE set, appended by apply.sh): infra-service reaches the entry over HTTPS
# (artifact S3 endpoint, app public-URL probes), so it must trust the CA that signed the entry's certificate.
# Sandboxes get the same file through opensandbox.toml (rendered by apply.sh). Node appends the file to its
# built-in roots, so a bare corporate root is enough here -- no need to bundle the public roots.
name: teable-sandbox-infra

services:
  infra-service:
    environment:
      NODE_EXTRA_CA_CERTS: /etc/ssl/private-ca/root-ca.crt
      PRIVATE_CA_FINGERPRINT: ${PRIVATE_CA_SHA256:-}   # written by apply.sh; a rotated CA file changes it, so `docker compose up -d` recreates this container
    volumes:
      - ${PRIVATE_CA_FILE:?set PRIVATE_CA_FILE in .env}:/etc/ssl/private-ca/root-ca.crt:ro
