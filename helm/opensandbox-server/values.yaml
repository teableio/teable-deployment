# Default values for opensandbox-server.

# -- Override the name of the chart
nameOverride: ""
# -- Resource names and app.kubernetes.io/name are fixed to this value, independent of release name
fullnameOverride: "opensandbox-server"

# -- Override the namespace (default: opensandbox-system)
namespaceOverride: ""

# -- Image pull secrets for the server deployment. Each entry: {name: <secret-name>}.
imagePullSecrets: []

# Server configuration
server:
  # Server RBAC (ServiceAccount, ClusterRole, ClusterRoleBinding).
  rbac:
    # -- Set false when cluster RBAC is centrally managed; bring your own SA + bindings.
    # Workloads keep referencing the same ServiceAccount name either way.
    create: true
    # -- Cluster-scoped half only (ClusterRole/ClusterRoleBinding): set create=false
    # for restricted deploy accounts; the ServiceAccount is still created.
    clusterScope:
      create: true
    # -- Namespace-scoped half (the ServiceAccount): set create=false to render
    # only the cluster-scoped half (admin bundle).
    namespaceScope:
      create: true

  # -- Additional environment variables for the server container.
  env: []
  # - name: OPENSANDBOX_API_KEY
  #   valueFrom:
  #     secretKeyRef:
  #       name: opensandbox-api-key
  #       key: api-key
  # -- Optional env var name used to inject [server].api_key into a runtime config file.
  apiKeyEnvName: ""

  # -- Server image configuration
  image:
    repository: ghcr.io/teableio/opensandbox-server
    tag: "v0.2.0-fix10"

  # -- Number of server replicas
  replicaCount: 2

  # -- Resource requests and limits
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 512Mi

  tolerations: []
  affinity: {}
  volumeMounts: []
  volumes: []

  # Pod- and container-level securityContext for the server. Empty by default
  # (the image runs as root). Set these when the control plane must run under a
  # specific identity -- for example so that the subPath pre-creation feature
  # writes directories as that identity and never needs a chown at all:
  #   podSecurityContext: {runAsUser: 1001, runAsGroup: 1001, runAsNonRoot: true}
  # Running as non-root REQUIRES moving the listener off the privileged port:
  # set containerPort below AND the matching `[server] port` in configToml.
  # It also REQUIRES a writable `[store] path` in configToml -- the default
  # sits under HOME, which a non-root uid lacks on the stock image, and the
  # server initializes the store at startup (e.g. `/tmp/opensandbox/opensandbox.db`).
  podSecurityContext: {}
  securityContext: {}

  # Port the server listens on inside the container. Must equal `[server] port`
  # in configToml. Keep 80 for root deployments; use e.g. 8080 for non-root,
  # since binding a port below 1024 needs CAP_NET_BIND_SERVICE.
  containerPort: 80

  # Optional BatchSandbox pod template override. When set, it is mounted at
  # /etc/opensandbox/batchsandbox-template.yaml and can be referenced by configToml.
  # Scheduling switches (bin-packing affinity, request envs, default memory
  # limit) live under global.sandboxScheduling — one knob shared with the
  # umbrella chart. See docs/sandbox-scheduling-v2.md. Private CA trust lives
  # under global.sandboxPrivateCa (see helm/private-ca.md), the non-root /
  # seccomp hardening switches under global.sandboxSecurity, and the npm
  # registry mirror under global.sandboxNpmRegistry (injects
  # NPM_CONFIG_REGISTRY / COREPACK_NPM_REGISTRY into every sandbox). The
  # template below is merged with those switches at render time; operator
  # values win, except for the securityContext fields global.sandboxSecurity
  # owns.
  batchSandboxTemplate: ""

  # Egress policy applied to sandbox Pods in the dataplane namespace.
  # By default, sandbox Pods can reach the public internet but not Kubernetes
  # internal Pod/Service/VPC ranges or cloud metadata endpoints.
  sandboxNetworkPolicy:
    enabled: false
    name: sandbox-egress-public-only
    # IPv4 and IPv6 entries are both accepted here; each is routed into the
    # blocked-range list of its own address family.
    serviceCidrs: []
    additionalBlockedCidrs: []
    dnsNamespace: kube-system
    dnsPorts:
      - 53
    # Allow-listed exceptions inside the blocked private ranges. Required when
    # platform endpoints the sandbox must call back (Teable / infra domains)
    # resolve to private IPs, e.g. an internal ingress LB VIP. Note this is an
    # L3/L4 allow: every virtual host behind the allowed address becomes
    # reachable (no hostname/SNI scoping) — prefer a platform-dedicated VIP, or
    # use the egress sidecar for domain-level control. Entries are
    # either a bare CIDR string, or a map with optional port scoping:
    #   - "10.0.12.34/32"
    #   - cidr: "10.0.12.34/32"
    #     ports:
    #       - protocol: TCP   # defaults to TCP when omitted
    #         port: 443
    additionalAllowedCidrs: []
    # Selector-based allow rules for in-cluster platform endpoints. Use these
    # instead of additionalAllowedCidrs when the CNI matches egress policies
    # against the post-DNAT pod IP (e.g. Alibaba Cloud Terway): there an ipBlock
    # allow for a Service ClusterIP never matches, and pod IPs are too ephemeral
    # to pin. Each entry takes namespaceSelector and/or podSelector
    # (NetworkPolicyPeer semantics) plus optional port scoping:
    #   - namespaceSelector:
    #       matchLabels:
    #         kubernetes.io/metadata.name: ingress-nginx
    #     podSelector:
    #       matchLabels:
    #         app.kubernetes.io/name: ingress-nginx
    #     ports:
    #       - protocol: TCP   # defaults to TCP when omitted
    #         port: 443
    additionalAllowedPeers: []

  # Lifecycle API ingress. Exposes opensandbox-server to the Control Service
  # (the opensandbox-server control-plane API) when the Control Service runs
  # outside the Kubernetes cluster.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    # Extra hostnames served with the same path and TLS secret (issue a
    # multi-SAN certificate covering all names). Used for cluster-scoped
    # domains during migrations.
    additionalHosts: []
    path: "/"
    pathType: "Prefix"
    tls:
      enabled: false
      secretName: ""
    certificate:
      enabled: false
      issuerName: ""
      issuerKind: ClusterIssuer
      secretName: ""
      dnsNames: []

  # Gateway (components/ingress): when enabled, writes config [ingress] and deploys the gateway
  gateway:
    enabled: false
    # Gateway RBAC (ServiceAccount, ClusterRole, ClusterRoleBinding); only rendered when gateway is enabled.
    rbac:
      # -- Set false when cluster RBAC is centrally managed; bring your own SA + bindings.
      # The gateway workload keeps referencing the same ServiceAccount name either way.
      create: true
      # -- Cluster-scoped half only (ClusterRole/ClusterRoleBinding): set create=false
      # for restricted deploy accounts; the ServiceAccount is still created.
      clusterScope:
        create: true
      # -- Namespace-scoped half (the ServiceAccount): set create=false to render
      # only the cluster-scoped half (admin bundle).
      namespaceScope:
        create: true
    # Public host sandbox previews are served on. Blank: derived from global.baseDomain
    # (*.sandbox.<base>); falls back to the opensandbox.example.com placeholder.
    host: ""
    gatewayRouteMode: "header"
    image:
      repository: ghcr.io/teableio/opensandbox-ingress
      tag: "v1.0.7"
    replicaCount: 2
    port: 28888
    dataplaneNamespace: "teable-sandbox"
    providerType: "batchsandbox"
    logLevel: "info"
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi
    ingress:
      enabled: false
      className: ""
      annotations: {}
      host: ""
      path: "/"
      pathType: "Prefix"
      tls:
        enabled: false
        secretName: ""
      certificate:
        enabled: false
        issuerName: ""
        issuerKind: ClusterIssuer
        secretName: ""
        dnsNames: []
    # OSEP-0011 (upstream OpenSandbox spec) signing keys shared between server and ingress.
    # When keys are provided, the server signs route tokens with the active key
    # and the ingress gateway verifies them.
    secureAccess:
      activeKey: ""
      # List of signing keys. Each entry: { key_id: "a", key: "<base64-secret>" }.
      # key_id must be exactly one character in [0-9a-z].
      keys: []

# -- Server config (TOML). Mounted at /etc/opensandbox/config.toml.
configToml: |
  [server]
  host = "0.0.0.0"
  port = 80
  api_key = ""

  [log]
  level = "INFO"

  [runtime]
  type = "kubernetes"
  execd_image = "ghcr.io/teableio/opensandbox-execd:v1.0.19-fix3"

  [kubernetes]
  kubeconfig_path = ""
  namespace = "teable-sandbox"
  informer_enabled = true
  informer_resync_seconds = 300
  informer_watch_timeout_seconds = 60
  sandbox_create_timeout_seconds = 86400
  sandbox_create_poll_interval_seconds = 0.5
  snapshot_create_timeout_seconds = 900
  workload_provider = "batchsandbox"
  batchsandbox_template_file = "/etc/opensandbox/batchsandbox-template.yaml"
  
  [egress]
  image = "ghcr.io/teableio/opensandbox-egress:v1.0.12"
  mode = "dns+nft"
