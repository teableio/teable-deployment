# Gateway workload (components/ingress): proxies sandbox traffic, aligned with server config [ingress].
{{- if .Values.server.gateway.enabled }}
{{- if include "opensandbox-server.secureAccessEnabled" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opensandbox-server.ingressGatewayFullname" . }}-secure-access
  namespace: {{ include "opensandbox-server.namespace" . }}
  labels:
    {{- include "opensandbox-server.ingressGatewaySelectorLabels" . | nindent 4 }}
stringData:
  keys: {{ include "opensandbox-server.secureAccessKeyString" . | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opensandbox-server.ingressGatewayFullname" . }}
  namespace: {{ include "opensandbox-server.namespace" . }}
  labels:
    helm.sh/chart: {{ include "opensandbox-server.chart" . }}
    {{- include "opensandbox-server.ingressGatewaySelectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ingress-gateway
    app.kubernetes.io/part-of: opensandbox
spec:
  replicas: {{ .Values.server.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "opensandbox-server.ingressGatewaySelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if include "opensandbox-server.secureAccessEnabled" . }}
      annotations:
        # Rotating the signing keys must roll the gateway too; the keys no longer sit in
        # the pod spec, so hash them here (the server side is covered by checksum/config-toml).
        checksum/secure-access: {{ include "opensandbox-server.secureAccessKeyString" . | sha256sum | quote }}
      {{- end }}
      labels:
        {{- include "opensandbox-server.ingressGatewaySelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ingress-gateway
        app.kubernetes.io/part-of: opensandbox
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "opensandbox-server.ingressGatewayFullname" . }}
      containers:
        - name: main
          image: {{ include "opensandbox-server.ingressGatewayImage" . }}
          imagePullPolicy: IfNotPresent
          args:
            - "--namespace={{ .Values.server.gateway.dataplaneNamespace }}"
            - "--port={{ .Values.server.gateway.port }}"
            - "--provider-type={{ .Values.server.gateway.providerType }}"
            - "--mode={{ include "opensandbox-server.ingressGatewayBinaryMode" . }}"
            - "--log-level={{ .Values.server.gateway.logLevel }}"
{{- if include "opensandbox-server.secureAccessEnabled" . }}
            # Key string comes from the Secret rendered above this Deployment, via the
            # SECURE_ACCESS_KEYS env; kubelet expands $(VAR), so the pod spec holds no
            # key material (the running process still receives it as a flag).
            - "--secure-access-keys=$(SECURE_ACCESS_KEYS)"
{{- end }}
{{- if include "opensandbox-server.secureAccessEnabled" . }}
          env:
            - name: SECURE_ACCESS_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "opensandbox-server.ingressGatewayFullname" . }}-secure-access
                  key: keys
{{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.gateway.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /status.ok
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /status.ok
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.server.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opensandbox-server.ingressGatewayFullname" . }}
  namespace: {{ include "opensandbox-server.namespace" . }}
  labels:
    helm.sh/chart: {{ include "opensandbox-server.chart" . }}
    {{- include "opensandbox-server.ingressGatewaySelectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ingress-gateway
    app.kubernetes.io/part-of: opensandbox
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: {{ .Values.server.gateway.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "opensandbox-server.ingressGatewaySelectorLabels" . | nindent 4 }}
{{- end }}
